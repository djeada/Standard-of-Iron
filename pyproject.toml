# Tool configuration only - Standard of Iron is not a Python package.
# Formatter/linter versions are pinned in tools/versions.env and driven by
# scripts/format.py.

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | build.*
  | third_party
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "build-debug",
    "build-tidy",
    "build-release",
    "build-ci-skip",
    "third_party",
    "dist",
]

[tool.ruff.lint]
# E/W  pycodestyle, F pyflakes, I import order, B bugbear.
# E501 is delegated to black; long literal strings must not fail the lint gate.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Generator scripts intentionally keep large tabular literals inline.
"scripts/generate-map-*.py" = ["E741"]
# The font compiler has to disable bytecode caching and extend sys.path before
# it can import the geometry modules that sit beside it, so its own imports
# cannot come first. Ruff already tolerates the sys.path line; the
# dont_write_bytecode assignment beside it is what trips E402. This lives here
# rather than as a `# noqa` because scripts/remove-comments.sh strips comments
# out of .py files, which would silently re-break the lint gate.
"tools/font/build_standard_iron.py" = ["E402"]
