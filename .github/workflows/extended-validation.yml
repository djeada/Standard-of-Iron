---
name: Extended Validation

# Expensive deterministic/perf and terrain-surface gates do not belong on every
# pull request. Run them weekly and on demand; release validation still owns the
# final ship gate, while weekly.yml continues to run the complete test suite
# under sanitizers/coverage and the cross-platform packaging checks.
on:
  schedule:
    # Mondays at 04:00 UTC, after the main weekly workflow has started.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"

jobs:
  simulation:
    name: Simulation budgets (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: extended-sim-release
          max-size: 1G

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEFAULT_LANG=en \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=OFF

      - name: Build benchmark
        run: cmake --build build --parallel --target sim_benchmark

      - name: Simulation budgets
        run: python scripts/check-sim-budgets.py --binary build/bin/sim_benchmark

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-benchmark-json
          path: artifacts/perf/
          if-no-files-found: ignore

  terrain-placement:
    name: Terrain-surface placement audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: extended-terrain-debug
          max-size: 500M

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=OFF

      - name: Build terrain probe
        run: cmake --build build --parallel --target terrain_probe

      - name: Authored placement audit
        run: python scripts/fix-map-prop-overlaps.py --check --surface require
