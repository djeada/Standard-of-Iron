---
name: Build (Windows)

# Reusable: called by weekly.yml and release.yml. Never publishes.
on:
  workflow_call:
    inputs:
      build-type:
        description: CMake build type
        type: string
        default: Release
      upload-artifacts:
        description: Upload the packaged ZIP as a workflow artifact
        type: boolean
        default: true
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        default: windows-zip
    outputs:
      package:
        description: File name of the produced ZIP
        value: ${{ jobs.build.outputs.package }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      package: ${{ steps.package.outputs.name }}
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      APP_NAME: standard_of_iron
      APP_DIR: build\bin
      QML_DIR: ui\qml
      QT_VERSION: 6.8.2
      QT_ARCH: win64_msvc2022_64
      QT_ROOT: D:\a\Standard-of-Iron\Qt
      MESA_DIST_VERSION: 26.1.6
      MESA_DIST_SHA256: 86b506ad38b8dae9d37bdade656a9003518d717bf4ff5475ff3f746e4ee768eb

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/map_pipeline/requirements.txt

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/release-version.sh)"
          echo "SOI_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Packaging version ${version}"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # The build renders the ambience beds from tools/audio_synth, which needs
      # an ffmpeg that can write Vorbis.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      # Fast path: official installer (allowed to fail)
      - name: Install Qt (fast path)
        id: fastqt
        continue-on-error: true
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: ${{ env.QT_ARCH }}
          cache: true
          aqtversion: "==3.3.0"
          modules: qt5compat qtmultimedia
          tools-only: false

      # Fallback: install with aqt directly if the fast path fails
      - name: Install Qt (fallback via aqt)
        if: ${{ steps.fastqt.outcome != 'success' }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0" "py7zr==1.0.*"

          $qtDir = Join-Path $env:QT_ROOT "$env:QT_VERSION\$env:QT_ARCH"
          New-Item -ItemType Directory -Force -Path $qtDir | Out-Null

          try {
            python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
              --outputdir "$env:QT_ROOT" `
              -m qtmultimedia qt5compat qtdeclarative
          } catch {
            Write-Warning "Explicit module install failed. Falling back to '-m all'. Error: $($_.Exception.Message)"
            python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
              --outputdir "$env:QT_ROOT" -m all
          }

          if (!(Test-Path "$qtDir\lib\cmake\Qt6\Qt6Config.cmake")) {
            Write-Error "Qt6Config.cmake not found in $qtDir after fallback install."
            exit 1
          }

          echo "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$qtDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Normalize env for both paths
      - name: Normalize Qt env
        shell: pwsh
        run: |
          $candidates = @()
          if ($env:Qt6_DIR) { $candidates += $env:Qt6_DIR }
          if ($env:QT_ROOT_DIR) { $candidates += $env:QT_ROOT_DIR }
          $candidates += (Join-Path $env:QT_ROOT "$env:QT_VERSION\$env:QT_ARCH")

          $qtDir = $null
          foreach ($c in $candidates | Select-Object -Unique) {
            if ($c -and (Test-Path (Join-Path $c 'lib\cmake\Qt6\Qt6Config.cmake'))) {
              $qtDir = $c
              break
            }
          }

          if (-not $qtDir) {
            Write-Error "Could not locate Qt6. Checked: $($candidates -join ', ')"
            exit 1
          }

          echo "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$qtDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Qt6_DIR=$qtDir"

      - name: Verify Qt installation
        shell: pwsh
        run: |
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          if (!(Test-Path "$env:Qt6_DIR\lib\cmake\Qt6\Qt6Config.cmake")) {
            Write-Error "Qt6Config.cmake not found in $env:Qt6_DIR"
            exit 1
          }
          if (!(Get-Command windeployqt -ErrorAction SilentlyContinue)) {
            Write-Error "windeployqt not found on PATH"
            exit 1
          }

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-windows-

      - name: Cache campaign map source datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/map_pipeline/build
          key: campaign-map-${{ runner.os }}-${{ hashFiles('tools/map_pipeline/pipeline.py', 'tools/map_pipeline/map_bounds.json') }}

      - name: Generate campaign map runtime assets
        shell: pwsh
        run: |
          python -m pip install -r tools/map_pipeline/requirements.txt
          python scripts/generate-campaign-map.py

      - name: Configure (CMake + Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} `
            -DDEFAULT_LANG=en `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=ON `
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --target standard_of_iron

      # Code signing (optional: signs .exe with Authenticode)
      - name: Sign executable
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_DATA) -or [string]::IsNullOrEmpty($env:CERT_PASSWORD)) {
            Write-Host "Code signing certificates not configured, skipping signing step"
            exit 0
          }

          $exePath = "$env:APP_DIR\$env:APP_NAME.exe"
          if (!(Test-Path $exePath)) {
            Write-Error "Executable not found at: $exePath"
            exit 1
          }

          $certPath = "$env:TEMP\cert.pfx"
          $certBytes = [System.Convert]::FromBase64String($env:CERT_DATA)
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            $searchPaths = @(
              "$env:ProgramFiles(x86)\Windows Kits",
              "$env:ProgramFiles\Windows Kits"
            )

            $signtool = $null
            foreach ($searchPath in $searchPaths) {
              if (Test-Path $searchPath) {
                $signtool = Get-ChildItem $searchPath -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match "x64" } |
                  Select-Object -First 1
                if ($signtool) { break }
              }
            }

            if (-not $signtool) {
              Write-Error "signtool.exe not found in Windows Kits directories"
              exit 1
            }

            Write-Host "Using signtool: $($signtool.FullName)"

            $signArgs = @(
              "sign",
              "/f", $certPath,
              "/p", $env:CERT_PASSWORD,
              "/tr", "http://timestamp.digicert.com",
              "/td", "SHA256",
              "/fd", "SHA256",
              "/v",
              $exePath
            )

            Write-Host "Signing $exePath..."
            & $signtool.FullName $signArgs

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Code signing failed with exit code $LASTEXITCODE"
              exit 1
            }

            Write-Host "Verifying signature..."
            & $signtool.FullName verify /pa /v $exePath

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Signature verification failed with exit code $LASTEXITCODE"
              exit 1
            }

            Write-Host "Signature verification successful"
          } finally {
            if (Test-Path $certPath) {
              Remove-Item $certPath -Force
            }
          }

      # Deploy Qt DLLs (dynamic linking ensures LGPL v3 compliance)
      - name: Deploy Qt
        shell: pwsh
        run: |
          $mode = if ("${{ inputs.build-type }}" -eq "Debug") { "--debug" } else { "--release" }
          windeployqt $mode --compiler-runtime --qmldir "$env:QML_DIR" "$env:APP_DIR\$env:APP_NAME.exe"

      - name: Write qt.conf
        shell: pwsh
        run: |
          @(
            '[Paths]'
            'Plugins = .'
            'Imports = qml'
            'Qml2Imports = qml'
            'Translations = translations'
          ) | Set-Content -Encoding ASCII "$env:APP_DIR\qt.conf"

      - name: Copy launcher and debug scripts
        shell: pwsh
        run: |
          Write-Host "Copying Windows launcher and debug scripts..."
          $scripts = @(
            "LAUNCH.bat",
            "run_debug.cmd",
            "run_debug_softwaregl.cmd"
          )

          foreach ($script in $scripts) {
            $src = "dist\windows\$script"
            $dst = "$env:APP_DIR\$script"

            if (!(Test-Path $src)) {
              Write-Error "Source script not found: $src"
              exit 1
            }

            Copy-Item $src $dst -Force
            Write-Host "Copied $script"
          }

          Write-Host "All launcher scripts deployed successfully."

      - name: Add README.txt for distribution
        shell: pwsh
        run: |
          @(
            'STANDARD OF IRON - Windows Distribution'
            ''
            'QUICK START'
            'Double-click standard_of_iron.exe or LAUNCH.bat.'
            ''
            'GRAPHICS REQUIREMENT'
            'The game requires desktop OpenGL 3.3 Core Profile and prefers 4.5.'
            'Drivers that also expose compute shaders, shader storage buffers'
            'and indirect draw get faster large-battle rendering automatically;'
            'this is detected at runtime and is never required.'
            'The package includes Mesa llvmpipe 26.1.6 for systems whose GPU'
            'driver cannot provide a compatible context.'
            ''
            'TROUBLESHOOTING'
            '1. Run run_debug.cmd and attach runlog.txt to an issue report.'
            '2. Update the graphics driver from the GPU manufacturer.'
            '3. Run run_debug_softwaregl.cmd to use the bundled CPU renderer.'
            ''
            'Do not force ANGLE or QT_QUICK_BACKEND=software. ANGLE exposes'
            'OpenGL ES, while the game uses desktop GLSL 3.3; Qt Quick software'
            'rendering does not support the gameplay framebuffer object.'
            ''
            'Report issues at: https://github.com/djeada/Standard-of-Iron/issues'
          ) | Set-Content -Encoding ASCII "$env:APP_DIR\README.txt"

      - name: Add software OpenGL fallback (mandatory)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtbin = Join-Path $env:Qt6_DIR "bin"
          $d3dCompiler = Join-Path $qtbin "d3dcompiler_47.dll"
          if (!(Test-Path $d3dCompiler)) {
            Write-Error "Missing required Qt runtime DLL: d3dcompiler_47.dll"
          }
          Copy-Item $d3dCompiler "$env:APP_DIR" -Force

          # Qt 6.8 still ships Mesa 11.2.2 as opengl32sw.dll. It only exposes
          # OpenGL 3.0 on the hosted runner, below both the GLSL 3.30 renderer
          # floor and the preferred 4.5 feature tier. Replace it with a pinned,
          # checksum-verified mesa-dist-win llvmpipe runtime. Mesa's WGL loader
          # depends on the adjacent Gallium megadriver, so both DLLs are part of
          # the payload.
          $archiveName = "mesa3d-$env:MESA_DIST_VERSION-release-msvc.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_DIST_VERSION/$archiveName"
          $mesaRoot = Join-Path $env:RUNNER_TEMP ("soi-mesa-" + [guid]::NewGuid())
          $archive = Join-Path $mesaRoot $archiveName
          New-Item -ItemType Directory -Path $mesaRoot | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:MESA_DIST_SHA256) {
            Write-Error "Mesa archive SHA256 mismatch: expected $env:MESA_DIST_SHA256, got $actualHash"
          }

          & 7z.exe x $archive "-o$mesaRoot" "x64/opengl32.dll" `
            "x64/libgallium_wgl.dll" -y
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to extract Mesa software OpenGL runtime"
          }

          Copy-Item "$mesaRoot\x64\opengl32.dll" `
            "$env:APP_DIR\opengl32sw.dll" -Force
          Copy-Item "$mesaRoot\x64\libgallium_wgl.dll" $env:APP_DIR -Force

          @(
            "Mesa $env:MESA_DIST_VERSION Windows software OpenGL runtime"
            "Source: $url"
            "SHA256: $actualHash"
            "Driver: llvmpipe"
          ) | Set-Content -Encoding ASCII "$env:APP_DIR\MESA3D_VERSION.txt"

          Write-Host "Mesa $env:MESA_DIST_VERSION software OpenGL deployed."

      - name: Copy assets
        shell: pwsh
        run: |
          if (!(Test-Path "$env:APP_DIR\assets")) {
            New-Item -ItemType Directory -Path "$env:APP_DIR\assets" | Out-Null
          }
          robocopy assets "$env:APP_DIR\assets" /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { exit 0 }

      - name: Sanity check deployed files
        shell: pwsh
        run: |
          Write-Host "=== Verifying Runtime Completeness ==="

          $req = @(
            "$env:APP_DIR\platforms\qwindows.dll",
            "$env:APP_DIR\Qt6Core.dll",
            "$env:APP_DIR\Qt6Gui.dll",
            "$env:APP_DIR\Qt6Qml.dll"
          )

          $graphics_fallbacks = @(
            "$env:APP_DIR\d3dcompiler_47.dll",
            "$env:APP_DIR\opengl32sw.dll",
            "$env:APP_DIR\libgallium_wgl.dll",
            "$env:APP_DIR\MESA3D_VERSION.txt"
          )

          $missing = @()

          Write-Host "Checking Qt runtime DLLs..."
          foreach ($f in $req) {
            if (!(Test-Path $f)) {
              $missing += $f
              Write-Error "Missing: $f"
            } else {
              Write-Host "Found: $(Split-Path -Leaf $f)"
            }
          }

          Write-Host "Checking graphics fallback DLLs..."
          foreach ($f in $graphics_fallbacks) {
            if (!(Test-Path $f)) {
              $missing += $f
              Write-Error "Missing: $f"
            } else {
              Write-Host "Found: $(Split-Path -Leaf $f)"
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "DEPLOYMENT FAILED - Missing files: $($missing -join ', ')"
            exit 1
          }

          Write-Host "All required runtime files are present."

      - name: Dependency check (dumpbin)
        shell: pwsh
        run: |
          Write-Host "Checking EXE dependencies with dumpbin..."

          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "Hostx64\\x64" } |
            Select-Object -First 1

          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found, skipping dependency check"
            exit 0
          }

          Write-Host "Using dumpbin: $($dumpbin.FullName)"

          $exePath = "$env:APP_DIR\$env:APP_NAME.exe"
          $output = & $dumpbin.FullName /DEPENDENTS $exePath 2>&1 | Out-String

          Write-Host "Dependencies:"
          Write-Host $output

          $dllPattern = '^\s+([a-zA-Z0-9_\-\.]+\.dll)\s*$'
          $dependencies = @()
          foreach ($line in $output -split "`n") {
            if ($line -match $dllPattern) {
              $dependencies += $matches[1]
            }
          }

          # Known system DLLs that do not need to be bundled.
          $knownSystemDlls = @(
            'KERNEL32.dll',
            'USER32.dll',
            'ADVAPI32.dll',
            'SHELL32.dll',
            'ole32.dll',
            'OLEAUT32.dll',
            'OPENGL32.dll',
            'GDI32.dll',
            'WS2_32.dll',
            'NETAPI32.dll'
          )

          $systemDirs = @(
            "$env:SystemRoot\System32",
            "$env:SystemRoot\SysWOW64"
          )

          $missingDeps = @()
          foreach ($dll in $dependencies) {
            if ($dll -match '^(api-ms-win-|ext-ms-)') {
              Write-Host "Skipping Windows API set: $dll"
              continue
            }

            if ($knownSystemDlls -contains $dll) {
              Write-Host "Skipping known system DLL: $dll"
              continue
            }

            $foundInApp = Test-Path (Join-Path $env:APP_DIR $dll)
            $foundInSystem = $false
            foreach ($sysDir in $systemDirs) {
              if (Test-Path (Join-Path $sysDir $dll)) {
                $foundInSystem = $true
                break
              }
            }

            if (-not $foundInApp -and -not $foundInSystem) {
              $missingDeps += $dll
              Write-Warning "Missing dependency: $dll"
            } else {
              $location = if ($foundInApp) { "app directory" } else { "system directory" }
              Write-Host "Found $dll in $location"
            }
          }

          if ($missingDeps.Count -gt 0) {
            Write-Error "Missing DLL dependencies: $($missingDeps -join ', ')"
            exit 1
          }

          Write-Host "All required dependencies are present"

      - name: Verify packaged gameplay renderer (software OpenGL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_OPENGL = 'software'
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_LOGGING_RULES = 'qt.rhi.*=false'
          $env:GALLIUM_DRIVER = 'llvmpipe'

          Push-Location "$env:APP_DIR"
          try {
            $process = Start-Process -FilePath ".\$env:APP_NAME.exe" `
              -ArgumentList "--release-self-test" `
              -RedirectStandardOutput "renderer_self_test_out.log" `
              -RedirectStandardError "renderer_self_test_err.log" `
              -PassThru -NoNewWindow

            if (-not $process.WaitForExit(210000)) {
              $process.Kill()
              $process.WaitForExit()
              Write-Error "Gameplay renderer self-test timed out"
            }
            # Ensure redirected streams are completely flushed.
            $process.WaitForExit()

            $output = @()
            if (Test-Path "renderer_self_test_out.log") {
              $output += Get-Content "renderer_self_test_out.log"
            }
            if (Test-Path "renderer_self_test_err.log") {
              $output += Get-Content "renderer_self_test_err.log"
            }
            $output | Write-Host

            if ($process.ExitCode -ne 0) {
              Write-Error "Gameplay renderer self-test failed with exit code $($process.ExitCode)"
            }
            if (($output -join "`n") -notmatch "SOI_RENDERER_SELF_TEST: PASS") {
              Write-Error "The executable exited without presenting a gameplay OpenGL frame"
            }
            foreach ($marker in @(
              'SOI_MISSION_SELF_TEST: PASS',
              'SOI_GRAPHICS_DEFAULT_SELF_TEST: PASS',
              'SOI_CAMPAIGN_MAP_SELF_TEST: PASS',
              'SOI_CREATURE_ASSET_SELF_TEST: PASS'
            )) {
              if (($output -join "`n") -notmatch [regex]::Escape($marker)) {
                Write-Error "Packaged release contract failed: missing $marker"
              }
            }
            # Music and ambience are read from assets\ rather than embedded in the
            # binary, so a package that loses that directory renders fine and is
            # simply mute. The self-test reports on it; fail the release here.
            if (($output -join "`n") -notmatch "SOI_AUDIO_SELF_TEST: PASS") {
              Write-Error "The packaged game cannot reach all of its audio assets"
            }
            # The pinned Mesa llvmpipe must satisfy both the portable 3.3 floor
            # and the preferred 4.5 tier. This catches a stale Qt software DLL,
            # an incomplete Mesa deployment, or an accidental ANGLE substitution.
            if (($output -join "`n") -notmatch "SOI_GL_FLOOR: PASS") {
              Write-Error "The bundled software renderer is below the OpenGL 3.3 Core floor"
            }
            if (($output -join "`n") -notmatch "SOI_GL_TIER_45: PASS") {
              Write-Error "The bundled software renderer did not grant OpenGL 4.5 Core"
            }
            $context = ($output | Select-String 'Context Version:' | Select-Object -First 1)
            $renderer = ($output | Select-String 'Renderer:' | Select-Object -First 1)
            "### Windows build`n`n| | |`n| --- | --- |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "| Software GL context | ``$context`` |`n| Renderer | ``$renderer`` |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } finally {
            Pop-Location
          }

      # Keep a static guard alongside the packaged runtime self-test.
      - name: Validate OpenGL requirements
        run: python scripts/validate_opengl_requirements.py

      - name: Final runtime readiness verification
        shell: pwsh
        run: |
          Write-Host "=== Final Runtime Readiness Check ==="

          $criticalFiles = @(
            "$env:APP_DIR\standard_of_iron.exe",
            "$env:APP_DIR\LAUNCH.bat",
            "$env:APP_DIR\README.txt",
            "$env:APP_DIR\run_debug.cmd",
            "$env:APP_DIR\run_debug_softwaregl.cmd",
            "$env:APP_DIR\opengl32sw.dll",
            "$env:APP_DIR\libgallium_wgl.dll",
            "$env:APP_DIR\MESA3D_VERSION.txt",
            "$env:APP_DIR\d3dcompiler_47.dll"
          )

          $allPresent = $true
          foreach ($file in $criticalFiles) {
            if (Test-Path $file) {
              Write-Host "OK: $(Split-Path -Leaf $file)"
            } else {
              Write-Error "MISSING: $(Split-Path -Leaf $file)"
              $allPresent = $false
            }
          }

          if (-not $allPresent) {
            Write-Error "Deployment is incomplete!"
            exit 1
          }

          Write-Host "Build is self-contained and runtime ready."

      # Qt is LGPL v3, so its notice has to travel with the binary rather than
      # living only in the source repository. The music additionally carries a
      # non-commercial restriction, which a player can only discover if the
      # file recording it is in the package they downloaded.
      - name: Copy licences into the payload
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md -Destination $env:APP_DIR -Force
          foreach ($f in @('LICENSE', 'THIRD_PARTY_LICENSES.md')) {
            $p = Join-Path $env:APP_DIR $f
            if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) {
              Write-Error "$f is missing from the payload"
              exit 1
            }
          }

      - name: Zip
        id: package
        shell: pwsh
        run: |
          $zip = "standard_of_iron-$env:SOI_VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:APP_DIR\*" -DestinationPath $zip -Force
          "name=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify package integrity
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.name }}"
          $size = (Get-Item $zip).Length
          Write-Host "ZIP size: $size bytes"
          if ($size -lt 20000000) {
            Write-Error "Packaged ZIP is implausibly small ($size bytes); packaging likely failed."
            exit 1
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # Written byte-for-byte as LF with no BOM: the release `verify` job
          # checks this file with GNU sha256sum on Linux, which would treat a
          # trailing CR as part of the file name and a BOM as a malformed line.
          $line = "$hash  $zip`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "$zip.sha256"), $line, $utf8NoBom)
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.upload-artifacts
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            standard_of_iron-*-win-x64.zip
            standard_of_iron-*-win-x64.zip.sha256
          retention-days: 14
          if-no-files-found: error
