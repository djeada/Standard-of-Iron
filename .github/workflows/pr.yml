---
name: Pull Request

# Pull requests are deliberately bounded: compiler-free policy/formatting gates
# plus a fast Linux test lane. That lane builds and runs every test binary; what
# it leaves out is the individual tests listed in tests/extended_tests.txt --
# headless battles and sweeps over every shipped asset, which cost seconds each
# and had grown to over ninety minutes. Simulation budgets, the terrain audit
# and the excluded tests themselves run on scheduled/manual workflows and
# release validation instead of occupying a PR runner for an hour or more.
on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  merge_group:

permissions:
  contents: read

# A push cancels only the obsolete run for this PR; unrelated PRs keep running.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"
  BUILD_TYPE: Debug

jobs:
  quality:
    name: Quality and source policy
    uses: ./.github/workflows/quality.yml

  test:
    name: Fast build and test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Roughly ten minutes of work: a warm-ccache build, then a test run that
    # measures in single-digit minutes. The ceiling is here to kill a hung run,
    # not to leave room for a slow one.
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      SOI_TEST_PROFILE: pr
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 ffmpeg

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pr-fast-ubuntu-24.04-${{ env.BUILD_TYPE }}
          max-size: 1G

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEFAULT_LANG=en \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=OFF

      # Every test binary, because linking them is not what made this lane
      # slow: with a warm ccache the whole build is a couple of minutes, and
      # dropping the renderer, application, arena and tool suites would have
      # cost a pull request its only check on four of the nine domains.
      - name: Build the test binaries
        run: |
          cmake --build build --parallel \
            --target soi_test_binaries content_validator

      # SOI_TEST_PROFILE=pr subtracts tests/extended_tests.txt; every binary in
      # the suite list still runs. SOI_TEST_REPORT_DIR collects the GoogleTest
      # JSON the speed gate below reads, which costs the run nothing.
      - name: Fast PR tests
        env:
          QT_QPA_PLATFORM: offscreen
          SOI_TEST_REPORT_DIR: artifacts/test-reports
        run: bash scripts/run-tests.sh build --gtest_brief=1

      # The split is only worth anything while it stays true. This fails if a
      # test that ran took longer than the per-test budget -- the way this lane
      # grew to ninety minutes in the first place -- and if a pattern in the
      # manifest has stopped matching anything, which would silently retire the
      # gate it names.
      - name: Fast profile stays fast
        if: always()
        run: |
          python scripts/check-test-speed.py \
            --build-dir build \
            --report-dir artifacts/test-reports

      - name: Translation coverage
        run: make translations-check

      - name: Audio wiring
        run: make audio-check

      - name: Content validation
        run: ./build/bin/content_validator assets

      - name: Validator integration tests
        run: bash tests/validator_integration_test.sh

      - name: Promo first-frame tests
        run: bash tests/promo_first_frame_test.sh

  readiness:
    name: PR diagnostics complete
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize required lanes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          {
            echo "## PR diagnostics"
            echo
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| Quality and source policy | ${QUALITY_RESULT} |"
            echo "| Fast build and test | ${TEST_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for result in "$QUALITY_RESULT" "$TEST_RESULT"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "One or more required PR lanes did not complete successfully."
          fi
          exit "$status"
