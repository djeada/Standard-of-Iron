---
name: Pull Request

# Pull requests are deliberately cheap: quality gates plus a Linux
# test build. Packaging, the renderer self-test and the Windows/macOS
# platform builds run nightly and are gated again on every release tag,
# which is where a break must be caught before shipping.
on:
  pull_request:
    branches: [main, develop]
  merge_group:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"
  BUILD_TYPE: Debug

jobs:
  # ---------------------------------------------------------------------
  # Lane 1: everything that needs no compiler. Fails in about a minute.
  # Shared with the release preflight so both run the identical gate.
  # ---------------------------------------------------------------------
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  # ---------------------------------------------------------------------
  # Lane 2: compile and run the tests. Only the targets the tests and the
  # content validator need are built - the game binary, map editor, arena
  # and preview tools are not, which is the bulk of the link time. The
  # full application build happens nightly and on every release tag.
  # ---------------------------------------------------------------------
  test:
    name: Build and test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 ffmpeg

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pr-ubuntu-24.04-${{ env.BUILD_TYPE }}
          max-size: 1G

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEFAULT_LANG=en

      - name: Build test targets
        run: |
          cmake --build build --parallel \
            --target soi_test_binaries content_validator

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-tests.sh build --gtest_brief=1

      # The catalogues are tracked, so they drift the moment someone adds a
      # qsTr() without rerunning `make translations`. They had drifted by 275
      # strings before the v0.1.0 audit caught it, precisely because nothing
      # here looked. This job already has a full Qt, so lupdate is available.
      - name: Translation coverage
        run: make translations-check

      - name: Content validation
        run: ./build/bin/content_validator assets

      - name: Validator integration tests
        run: bash tests/validator_integration_test.sh
