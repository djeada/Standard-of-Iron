---
name: Pull Request

# Pull requests are deliberately bounded: compiler-free policy/formatting gates
# plus a fast Linux core test profile. Full presentation/application/tool suites,
# simulation budgets and terrain audits run on scheduled/manual workflows and
# release validation instead of occupying a PR runner for an hour or more.
on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  merge_group:

permissions:
  contents: read

# A push cancels only the obsolete run for this PR; unrelated PRs keep running.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"
  BUILD_TYPE: Debug

jobs:
  quality:
    name: Quality and source policy
    uses: ./.github/workflows/quality.yml

  test:
    name: Fast build and test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      SOI_TEST_PROFILE: pr
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 ffmpeg

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pr-fast-ubuntu-24.04-${{ env.BUILD_TYPE }}
          max-size: 1G

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEFAULT_LANG=en \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=OFF

      # PRs compile and run the core/headless suites only. The full target also
      # links renderer, application, arena and tool tests and is intentionally
      # reserved for weekly/manual/release validation.
      - name: Build fast PR test targets
        run: |
          cmake --build build --parallel --target \
            simulation_tests \
            combat_balance_tests \
            ai_tests \
            campaign_tests \
            persistence_tests \
            content_validator

      - name: Fast PR tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-tests.sh build --gtest_brief=1

      - name: Translation coverage
        run: make translations-check

      - name: Audio wiring
        run: make audio-check

      - name: Content validation
        run: ./build/bin/content_validator assets

      - name: Validator integration tests
        run: bash tests/validator_integration_test.sh

      - name: Promo first-frame tests
        run: bash tests/promo_first_frame_test.sh

  readiness:
    name: PR diagnostics complete
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize required lanes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          {
            echo "## PR diagnostics"
            echo
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| Quality and source policy | ${QUALITY_RESULT} |"
            echo "| Fast build and test | ${TEST_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for result in "$QUALITY_RESULT" "$TEST_RESULT"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "One or more required PR lanes did not complete successfully."
          fi
          exit "$status"
