---
name: Quality

# Reusable compiler-free gate shared by pull requests and release preflight.
# Source architecture/migration policy is intentionally its own fast job so a
# policy failure is not reported as a generic formatting/build failure.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Source policy (architecture + migration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Policy runner self-test
        run: python scripts/check-pr-policy.py --self-test

      - name: PR source policy
        run: python scripts/check-pr-policy.py

  quality:
    name: Formatting, lint and static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned formatting toolchain
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/versions.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-format-${CLANG_FORMAT_VERSION%%.*}" \
            shellcheck \
            qt6-declarative-dev-tools \
            qml6-module-qtqml \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qttest
          python -m pip install --upgrade pip
          python -m pip install \
            "black==${BLACK_VERSION}" \
            "ruff==${RUFF_VERSION}" \
            "gersemi==${GERSEMI_VERSION}" \
            "yamllint==${YAMLLINT_VERSION}"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          npm install -g "prettier@${PRETTIER_VERSION}"
          echo "CLANG_FORMAT=clang-format-${CLANG_FORMAT_VERSION%%.*}" >> "$GITHUB_ENV"

      - name: Toolchain report
        run: make format-doctor

      - name: Formatting
        run: python scripts/format.py --all --check --strict

      - name: Lint
        run: python scripts/format.py --all --lint --strict

      - name: Quality markers
        run: |
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.py' '*.sh' \
            | xargs -0 -r python scripts/check-quality-markers.py

      - name: QML typography
        run: python scripts/check-typography.py

      - name: Static content validation
        run: |
          python scripts/validate_shader_uniforms.py
          python scripts/validate_opengl_requirements.py
          python scripts/validate_qrc_resources.py

  portability:
    name: Portability policy (compiler-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install glslang
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools

      - name: Portability (GLSL, Windows and includes)
        run: |
          python scripts/check-portability.py --only glsl,windows,includes \
            --require-all
