---
name: Build (macOS)

# Reusable: called by nightly.yml and release.yml. Never publishes.
on:
  workflow_call:
    inputs:
      build-type:
        description: CMake build type
        type: string
        default: Release
      upload-artifacts:
        description: Upload the packaged DMG as a workflow artifact
        type: boolean
        default: true
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        default: macos-dmg
    outputs:
      package:
        description: File name of the produced DMG
        value: ${{ jobs.build.outputs.package }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      package: ${{ steps.package.outputs.name }}
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      APP_NAME: standard_of_iron
      APP_DIR: build/bin
      QML_DIR: ui/qml
      DMG_NAME: standard_of_iron-macos.dmg
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install ninja

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.2"
          host: mac
          arch: clang_64
          cache: true
          modules: qt5compat qtmultimedia

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: macos-${{ inputs.build-type }}
          max-size: 500M

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-macos-

      - name: Configure
        # clang_64 is the x86_64 Qt variant; target x86_64 explicitly so that
        # the build is consistent on both Intel and Apple Silicon runners.
        # The resulting binary runs on Apple Silicon via Rosetta 2.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEFAULT_LANG=en \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build --config ${BUILD_TYPE}

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-tests.sh build

      - name: Validate OpenGL requirements
        run: python3 scripts/validate_opengl_requirements.py

      - name: Deploy Qt (macdeployqt)
        run: macdeployqt "${APP_DIR}/${APP_NAME}.app" -qmldir="${QML_DIR}" -verbose=1

      - name: Copy assets into .app bundle
        run: |
          # Place assets in Contents/Resources/assets/ (standard bundle location)
          mkdir -p "${APP_DIR}/${APP_NAME}.app/Contents/Resources/assets"
          rsync -a assets/ "${APP_DIR}/${APP_NAME}.app/Contents/Resources/assets/"

      - name: Verify packaged gameplay renderer
        run: |
          set -o pipefail
          "${APP_DIR}/${APP_NAME}.app/Contents/MacOS/${APP_NAME}" \
            --renderer-self-test 2>&1 | tee renderer_self_test.log
          grep -q "SOI_RENDERER_SELF_TEST: PASS" renderer_self_test.log
          # Music and ambience are read from assets/ rather than embedded in
          # the binary, so a package that loses that directory renders fine and
          # is simply mute. The self-test reports on it; fail the release here.
          grep -q "SOI_AUDIO_SELF_TEST: PASS" renderer_self_test.log

      - name: Create DMG
        id: package
        run: |
          set -euo pipefail
          hdiutil create -volname "Standard of Iron" \
            -srcfolder "${APP_DIR}/${APP_NAME}.app" -ov -format UDZO "${DMG_NAME}"
          echo "name=${DMG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Sign and notarize (optional)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign-and-notarize-macos.sh "${APP_DIR}/${APP_NAME}.app" "${DMG_NAME}"

      - name: Verify package integrity
        run: |
          set -euo pipefail
          test -s "${DMG_NAME}"
          hdiutil verify "${DMG_NAME}"
          size=$(stat -f%z "${DMG_NAME}")
          echo "DMG size: $size bytes"
          test "$size" -gt 20000000
          shasum -a 256 "${DMG_NAME}" | tee "${DMG_NAME}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.upload-artifacts
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          retention-days: 14
          if-no-files-found: error
