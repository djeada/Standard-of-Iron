---
name: Build (Linux)

# Reusable: called by weekly.yml (packaging dry run) and by release.yml
# (gated release build). It never publishes anything itself - publication is
# the release pipeline's single, gated responsibility.
on:
  workflow_call:
    inputs:
      build-type:
        description: CMake build type
        type: string
        default: Release
      upload-artifacts:
        description: Upload the packaged AppImage as a workflow artifact
        type: boolean
        default: true
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        default: linux-appimage
      debug-symbols:
        description: >-
          Build with debug information, ship a stripped binary, and upload the
          split .debug file as a private symbols-linux artifact.
        type: boolean
        default: false
    outputs:
      package:
        description: File name of the produced AppImage
        value: ${{ jobs.build.outputs.package }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      package: ${{ steps.package.outputs.name }}
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      APP_NAME: standard_of_iron
      APP_DIR: build/bin
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/map_pipeline/requirements.txt

      - name: Resolve release version
        run: |
          set -euo pipefail
          version="$(bash scripts/release-version.sh)"
          echo "SOI_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Packaging version ${version}"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.2"
          host: linux
          # aqt 3.3 uses the fully qualified Linux desktop architecture name.
          arch: linux_gcc_64
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf file rsync xvfb ffmpeg

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-${{ inputs.build-type }}
          max-size: 500M

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-ubuntu-22.04-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: deps-ubuntu-22.04-

      - name: Cache campaign map source datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/map_pipeline/build
          key: campaign-map-${{ runner.os }}-${{ hashFiles('tools/map_pipeline/pipeline.py', 'tools/map_pipeline/map_bounds.json') }}

      - name: Generate campaign map runtime assets
        run: |
          python -m pip install -r tools/map_pipeline/requirements.txt
          python scripts/generate-campaign-map.py

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEFAULT_LANG=en \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=ON \
            -DSOI_RELEASE_DEBUG_INFO=${{ inputs.debug-symbols && 'ON' || 'OFF' }} \
            -DBUILD_TESTING=OFF
          cmake --build build --config ${BUILD_TYPE} --target standard_of_iron

      # The debug information leaves the binary before linuxdeploy copies it
      # into the AppDir. The GNU debuglink and the build ID are what let a
      # debugger find the private .debug file again for a crash report.
      - name: Split debug symbols
        if: inputs.debug-symbols
        run: |
          set -euo pipefail
          binary="${APP_DIR}/${APP_NAME}"
          mkdir -p symbols-linux
          objcopy --only-keep-debug "${binary}" "symbols-linux/${APP_NAME}.debug"
          objcopy --strip-debug --strip-unneeded \
            --add-gnu-debuglink="symbols-linux/${APP_NAME}.debug" "${binary}"
          build_id="$(readelf -n "${binary}" | awk '/Build ID/ {print $3}')"
          test -n "${build_id}"
          echo "${build_id}" > symbols-linux/BUILD_ID
          echo "GNU build ID ${build_id}"

      - name: Validate OpenGL requirements
        run: python3 scripts/validate_opengl_requirements.py

      - name: Package AppImage
        id: package
        run: |
          set -euo pipefail
          ./scripts/package-appimage.sh "${APP_NAME}" "${APP_DIR}" ui/qml

          # linuxdeploy names the output after the .desktop entry, which knows
          # nothing about versions. Two releases would otherwise arrive in a
          # player's downloads folder under the same file name.
          built="$(ls ./*.AppImage | head -1)"
          versioned="standard_of_iron-${SOI_VERSION}-linux-x86_64.AppImage"
          mv "${built}" "${versioned}"
          echo "name=${versioned}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged gameplay renderer (Mesa software OpenGL)
        env:
          APPIMAGE: ${{ steps.package.outputs.name }}
        run: |
          set -o pipefail
          appimage_path="./${APPIMAGE}"
          chmod +x "$appimage_path"

          # LIBGL_ALWAYS_SOFTWARE=1 forces Mesa's llvmpipe, which supports
          # OpenGL 4.5 Core Profile -- a superset of the 3.3 Core the game
          # requires. This validates the full GL init path without a GPU.
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=desktop
          export QT_LOGGING_RULES="qt.rhi.*=false"

          timeout 1560s xvfb-run --auto-servernum -- \
            "$appimage_path" --release-self-test \
            2>&1 | tee renderer_self_test.log
          grep -q "SOI_RENDERER_SELF_TEST: PASS" renderer_self_test.log
          grep -q "SOI_MISSION_SELF_TEST: PASS" renderer_self_test.log
          grep -q "SOI_GRAPHICS_DEFAULT_SELF_TEST: PASS" renderer_self_test.log
          grep -q "SOI_CAMPAIGN_MAP_SELF_TEST: PASS" renderer_self_test.log
          grep -q "SOI_CREATURE_ASSET_SELF_TEST: PASS" renderer_self_test.log
          grep -q "SOI_GL_FLOOR: PASS" renderer_self_test.log
          grep -q "SOI_GL_TIER_45: PASS" renderer_self_test.log

          # GPU crowd culling needs compute shaders, SSBOs and indirect draw.
          # OpenGL 3.3 Core stays the floor, so the renderer must present the
          # same frame without that path -- this is the configuration every
          # driver below 4.3 lands on, including Apple's 4.1 cap. Forcing the
          # context down to 3.3 exercises the same fallback the pipeline takes
          # when RiggedCullPipeline reports itself unavailable.
          MESA_GL_VERSION_OVERRIDE=3.3 xvfb-run --auto-servernum -- \
            "$appimage_path" --renderer-self-test 2>&1 | tee renderer_fallback.log
          grep -q "SOI_RENDERER_SELF_TEST: PASS" renderer_fallback.log
          # Music and ambience are read from assets/ rather than embedded in
          # the binary, so a package that loses that directory renders fine and
          # is simply mute. The self-test reports on it; fail the release here.
          grep -q "SOI_AUDIO_SELF_TEST: PASS" renderer_self_test.log

      # Saves live under QStandardPaths::AppDataLocation, and Steam Auto-Cloud
      # is configured against that exact directory. Ask the packaged build
      # where it is, rather than trusting that it has not moved.
      - name: Report the save location
        env:
          APPIMAGE: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          "./${APPIMAGE}" --print-data-paths | tee data_paths.txt
          expected="${XDG_DATA_HOME:-${HOME}/.local/share}/standard_of_iron/saves"
          grep -qx "SOI_SAVES_DIR=${expected}" data_paths.txt
          echo "| Save directory | \`$(sed -n 's/^SOI_SAVES_DIR=//p' data_paths.txt)\` |" \
            >> "$GITHUB_STEP_SUMMARY"

      # Steam installs the unpacked AppDir, not the AppImage. Stage it the way
      # the Steam upload will. If anything a depot needs is missing, or
      # anything private leaked in, this fails on the build that produced it.
      - name: Verify the Steam depot this package would produce
        env:
          APPIMAGE: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          python3 scripts/steam-release.py stage --platform linux \
            --package "${APPIMAGE}" --out "${RUNNER_TEMP}/steam-stage/linux"
          python3 scripts/steam-release.py verify --platform linux \
            --stage "${RUNNER_TEMP}/steam-stage/linux"
          rm -rf "${RUNNER_TEMP}/steam-stage"

      - name: Verify package integrity
        env:
          APPIMAGE: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          test -s "$APPIMAGE"
          # A truncated or asset-less AppImage is a few MB; a real one is far
          # larger. Catch broken packaging before it reaches a release.
          size=$(stat -c%s "$APPIMAGE")
          echo "AppImage size: $size bytes"
          test "$size" -gt 20000000
          # Bare file name so the release `verify` job can check it from the
          # flattened artifact directory.
          sha256sum "$APPIMAGE" | tee "${APPIMAGE}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.upload-artifacts
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.debug-symbols
        with:
          name: symbols-linux
          path: symbols-linux/
          retention-days: 90
          if-no-files-found: error
