---
name: Release

# Gated release pipeline. This is the thorough tier: pull requests stay cheap,
# so a release tag is the point at which every supported platform must build,
# self-test, package, and be proven deliverable.
#
#   preflight -> build (linux | macos | windows) -> verify -> publish
#
# Nothing is published until all three platforms have produced a verified
# package. A single broken platform fails the release rather than leaving a
# tag half-published with a missing download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify release candidates without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Cheap gate first: never spend three platform builds on a tag that
  # cannot pass the same checks its pull requests had to.
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight
    uses: ./.github/workflows/quality.yml

  build-linux:
    name: Build Linux
    needs: preflight
    uses: ./.github/workflows/build-linux.yml
    with:
      build-type: Release
      artifact-name: release-linux

  build-macos:
    name: Build macOS
    needs: preflight
    uses: ./.github/workflows/build-macos.yml
    with:
      build-type: Release
      artifact-name: release-macos
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: preflight
    uses: ./.github/workflows/build-windows.yml
    with:
      build-type: Release
      artifact-name: release-windows
    secrets: inherit

  # ---------------------------------------------------------------------
  # Gate: every supported OS must be represented by exactly one package,
  # each package must carry a checksum, and every checksum must verify.
  # ---------------------------------------------------------------------
  verify:
    name: Verify release candidate
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          pattern: release-*
          merge-multiple: true

      - name: Every supported platform is represented exactly once
        working-directory: packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la

          status=0
          check_one() {
            local os="$1" pattern="$2"
            local matches=($pattern)
            case "${#matches[@]}" in
              1) echo "ok: ${os} -> ${matches[0]}" ;;
              0) echo "::error::${os}: no package matching '${pattern}'"; status=1 ;;
              *) echo "::error::${os}: expected one package matching '${pattern}', found ${#matches[@]}: ${matches[*]}"; status=1 ;;
            esac
          }

          check_one Linux   '*.AppImage'
          check_one macOS   '*.dmg'
          check_one Windows '*.zip'
          exit "$status"

      - name: Every package has a verified checksum
        working-directory: packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          status=0
          for package in *.AppImage *.dmg *.zip; do
            if [ ! -f "${package}.sha256" ]; then
              echo "::error::${package} has no .sha256 companion"
              status=1
              continue
            fi
            # The build jobs record checksums with bare file names, so verify
            # from this directory and let sha256sum resolve them.
            sha256sum --check --strict "${package}.sha256"
          done
          exit "$status"

      - name: Release summary
        run: |
          {
            echo "## Release candidate ${GITHUB_REF_NAME}"
            echo
            echo "| Platform | Package | Size |"
            echo "| --- | --- | --- |"
            for f in packages/*; do
              case "$f" in
                *.sha256) continue ;;
                *.AppImage) os=Linux ;;
                *.dmg) os=macOS ;;
                *.zip) os=Windows ;;
                *) os=other ;;
              esac
              printf '| %s | %s | %s |\n' "$os" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Publish: the only job with write access, and the only one that can
  # create a release. Skipped entirely for dry runs.
  # ---------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          pattern: release-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            packages/*.AppImage
            packages/*.dmg
            packages/*.zip
            packages/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      # A release that silently lost a platform's download is the exact
      # failure this pipeline exists to prevent, so confirm what landed.
      - name: Confirm all platform downloads are attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')
          echo "Attached assets:"
          echo "$assets"

          status=0
          for suffix in .AppImage .dmg .zip; do
            if ! grep -q -- "${suffix}\$" <<< "$assets"; then
              echo "::error::published release has no ${suffix} download"
              status=1
            fi
          done
          exit "$status"
