---
name: Release

# Gated release pipeline. A release tag runs the complete compiled test suite,
# then every supported platform must build, self-test, package, and be proven
# deliverable.
#
#   preflight -> build (linux | macos | windows) -> verify -> publish
#
# Nothing is published until all three platforms have produced a verified
# package. A single broken platform fails the release rather than leaving a
# tag half-published with a missing download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify release candidates without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Run the same quality and compiled-test lanes as a pull request before
  # spending three platform builds on a tag.
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight
    uses: ./.github/workflows/pr.yml

  build-linux:
    name: Build Linux
    needs: preflight
    uses: ./.github/workflows/build-linux.yml
    with:
      build-type: Release
      artifact-name: release-linux

  build-macos:
    name: Build macOS
    needs: preflight
    uses: ./.github/workflows/build-macos.yml
    with:
      build-type: Release
      artifact-name: release-macos
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: preflight
    uses: ./.github/workflows/build-windows.yml
    with:
      build-type: Release
      artifact-name: release-windows
    secrets: inherit

  # ---------------------------------------------------------------------
  # Gate: every supported OS must be represented by exactly one package,
  # each package must carry a checksum, and every checksum must verify.
  # ---------------------------------------------------------------------
  verify:
    name: Verify release candidate
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          pattern: release-*
          merge-multiple: true

      - name: Every supported platform is represented exactly once
        working-directory: packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la

          status=0
          check_one() {
            local os="$1" pattern="$2"
            local matches=($pattern)
            case "${#matches[@]}" in
              1) echo "ok: ${os} -> ${matches[0]}" ;;
              0) echo "::error::${os}: no package matching '${pattern}'"; status=1 ;;
              *) echo "::error::${os}: expected one package matching '${pattern}', found ${#matches[@]}: ${matches[*]}"; status=1 ;;
            esac
          }

          check_one Linux   '*.AppImage'
          check_one macOS   '*.dmg'
          check_one Windows '*.zip'
          exit "$status"

      - name: Every package has a verified checksum
        working-directory: packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          status=0
          for package in *.AppImage *.dmg *.zip; do
            if [ ! -f "${package}.sha256" ]; then
              echo "::error::${package} has no .sha256 companion"
              status=1
              continue
            fi
            # The build jobs record checksums with bare file names, so verify
            # from this directory and let sha256sum resolve them.
            sha256sum --check --strict "${package}.sha256"
          done
          exit "$status"

      - name: Release summary
        run: |
          {
            echo "## Release candidate ${GITHUB_REF_NAME}"
            echo
            echo "| Platform | Package | Size |"
            echo "| --- | --- | --- |"
            for f in packages/*; do
              case "$f" in
                *.sha256) continue ;;
                *.AppImage) os=Linux ;;
                *.dmg) os=macOS ;;
                *.zip) os=Windows ;;
                *) os=other ;;
              esac
              printf '| %s | %s | %s |\n' "$os" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Publish: the only job with write access, and the only one that can
  # create a release. Skipped entirely for dry runs.
  # ---------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The notes come from CHANGELOG.md rather than from generate_release_notes.
      # Auto-generation walks back to the previous tag, and on a first release
      # that means every merged pull request since the repository began -- a wall
      # of "Chore/format wildlife gait models" that tells a player nothing.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Checkout cleans untracked workspace files. Download release artifacts
      # afterwards so packages/ survives until the upload action runs.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          pattern: release-*
          merge-multiple: true

      - name: Confirm release assets are staged for publishing
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(packages/*.AppImage packages/*.dmg packages/*.zip packages/*.sha256)
          if [ "${#assets[@]}" -ne 6 ]; then
            printf '::error::expected three packages and three checksums, found %d\n' "${#assets[@]}"
            printf '  %s\n' "${assets[@]}"
            exit 1
          fi
          printf 'Publishing %s\n' "${assets[@]}"

      - name: Extract release notes for this tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Everything between this version's heading and the next version
          # heading. The trailing link definitions are markdown plumbing and are
          # dropped; "## Save compatibility" is deliberately kept, because a
          # release that silently discards saves should say so on its own page.
          awk -v want="${version}" '
            /^## \[/ {
              if (found) { exit }
              if (index($0, "[" want "]") > 0) { found = 1; next }
            }
            found && !/^\[[^]]+\]:/ { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}. Add one before tagging."
            exit 1
          fi
          cat release_notes.md

      - name: Remove the superseded release object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --yes
          fi

      - name: Publish
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            packages/*.AppImage
            packages/*.dmg
            packages/*.zip
            packages/*.sha256
          fail_on_unmatched_files: true
          body_path: release_notes.md

      # A release that silently lost a platform's download is the exact
      # failure this pipeline exists to prevent, so confirm what landed.
      - name: Confirm all platform downloads are attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')
          echo "Attached assets:"
          echo "$assets"

          status=0
          for suffix in .AppImage .dmg .zip; do
            if ! grep -q -- "${suffix}\$" <<< "$assets"; then
              echo "::error::published release has no ${suffix} download"
              status=1
            fi
          done
          exit "$status"
