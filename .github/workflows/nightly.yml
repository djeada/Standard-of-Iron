---
name: Nightly

on:
  schedule:
    # Mondays at 01:00 UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"

jobs:
  # ---------------------------------------------------------------------
  # The full-tree clang-tidy / qmllint pass that is too slow for a PR.
  # ---------------------------------------------------------------------
  deep-analysis:
    name: Deep static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLANG_TIDY: clang-tidy-18
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 clang-tidy-18 qt6-declarative-dev-tools

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1
        with:
          key: nightly-analysis
          max-size: 500M

      # clang-tidy needs the generated moc/qrc headers, so the tree must be
      # built before it can be analysed.
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDEFAULT_LANG=en
          cmake --build build --parallel

      - name: Whole-project lint
        id: lint
        continue-on-error: true
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint
        run: |
          set -o pipefail
          python scripts/format.py --all --lint --deep --build-dir build \
            2>&1 | tee deep-lint.log

      - name: Summarise findings
        if: always()
        run: |
          {
            echo "## Deep static analysis"
            echo
            echo "Result: \`${{ steps.lint.outcome }}\`"
            echo
            echo '```'
            grep -E '^\s+(ok|FAIL|skip|advisory)' deep-lint.log || tail -n 40 deep-lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deep-lint-report
          path: deep-lint.log
          retention-days: 30

      - name: Fail on non-advisory findings
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Deep analysis reported findings; see the deep-lint-report artifact."
          grep -E '^\s+FAIL' deep-lint.log && exit 1 || exit 0

  # ---------------------------------------------------------------------
  # Sanitizer lanes. Tests only - the renderer needs a GPU context that a
  # sanitized headless run cannot reliably provide.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 mesa-utils

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1
        with:
          key: nightly-san-${{ matrix.sanitizer }}
          max-size: 500M

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DENABLE_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under ${{ matrix.sanitizer }}Sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

  # ---------------------------------------------------------------------
  # Coverage report over the unit test suite.
  # ---------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 gcovr

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

      - name: Generate report
        run: |
          gcovr --root . \
            --exclude 'build/' \
            --exclude 'third_party/' \
            --exclude 'tests/' \
            --html-details coverage.html \
            --xml coverage.xml \
            --print-summary | tee coverage-summary.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage*.html
            coverage.xml
            coverage-summary.txt
          retention-days: 30

  # ---------------------------------------------------------------------
  # Full build, renderer self-test and packaging dry run on every supported
  # platform. Pull requests only compile and test on Linux, so this is what
  # catches Windows/macOS breakage between releases - within a day rather
  # than at tag time.
  # ---------------------------------------------------------------------
  package-linux:
    name: Package (Linux)
    uses: ./.github/workflows/build-linux.yml
    with:
      build-type: Release
      upload-artifacts: false

  package-macos:
    name: Package (macOS)
    uses: ./.github/workflows/build-macos.yml
    with:
      build-type: Release
      upload-artifacts: false
    secrets: inherit

  package-windows:
    name: Package (Windows)
    uses: ./.github/workflows/build-windows.yml
    with:
      build-type: Release
      upload-artifacts: false
    secrets: inherit
