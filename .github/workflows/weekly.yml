---
# The slow gates: the Clang + libc++ portability pass, the sanitizer lanes,
# coverage, and a packaging dry run on all three platforms. Pull requests
# deliberately skip these, so this is the only thing that runs them between
# release tags. Whole-tree clang-tidy is not here: it ran past three hours on
# one runner, so it stays a local `make lint-deep` pass.
#
# It was called Nightly and ran every night until the cron moved to Mondays;
# the name, the identifiers and the prose kept saying nightly for months after
# the schedule stopped being one. It is weekly, and now says so.
name: Weekly

on:
  schedule:
    # Mondays at 01:00 UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.2"

jobs:
  # ---------------------------------------------------------------------
  # The macOS stand-in: every translation unit reparsed with Clang and libc++,
  # which are the two things AppleClang is that GCC and libstdc++ are not.
  # Syntax-only, so nothing links and Qt built against libstdc++ raises no ABI
  # question -- but it needs the compile database and the generated moc headers.
  #
  # It is here rather than on pull requests because it costs ~118 CPU minutes,
  # which is half an hour of a four-core runner, and the pull request lane is
  # deliberately cheap. The compiler-free portability passes -- including the
  # include-graph one that catches the class of break that failed this
  # workflow on 2026-08-17 -- do run on every pull request, in quality.yml.
  #
  # It used to be the last step of a whole-project clang-tidy job, so that
  # job's timeout cancelled it too and a portability break reported nothing. It is its own
  # job now. --require-all so a missing clang fails the job rather than
  # skipping the pass and reporting a green it did not earn.
  # ---------------------------------------------------------------------
  # The budget is the measured cost, not a round number. On 21 Sep 2026 this job
  # was cancelled at its 90-minute ceiling with the reparse still running: the
  # build before it takes about 35 minutes because ccache is effectively cold
  # every week (a restored 330 MB cache hit 4 of 1377 compilations -- a week of
  # commits invalidates it), and the reparse itself is 1342 first-party
  # translation units at 3.5 s each on average and 7.4 s for the largest, which
  # is 80-165 CPU-minutes and 20-45 minutes on a four-core runner. 150 leaves
  # room for both without leaving a hung pass running for hours.
  portability:
    name: Portability (Clang + libc++)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install Clang and libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 ffmpeg \
            clang libc++-dev libc++abi-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: weekly-portability
          max-size: 1G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_GENERATED_CAMPAIGN_MAP_ASSETS=OFF

      - name: Build the compile database's targets
        run: cmake --build build --parallel --target soi_test_binaries

      - name: Portability (Clang + libc++)
        run: |
          python scripts/check-portability.py --only apple \
            --build-dir build --require-all

  # ---------------------------------------------------------------------
  # Sanitizer lanes. Tests only - the renderer needs a GPU context that a
  # sanitized headless run cannot reliably provide.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 mesa-utils ffmpeg

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: weekly-san-${{ matrix.sanitizer }}
          max-size: 500M

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DENABLE_SANITIZER=${{ matrix.sanitizer }}

      # Only what run-tests.sh runs. soi_test_binaries already pulls in the
      # gameplay verifier and the QML suite, so this covers everything the next
      # step executes; the game binary, map editor, arena and preview tools are
      # not tested here and are the bulk of a sanitized Debug link.
      - name: Build the test binaries
        run: cmake --build build --parallel --target soi_test_binaries

      # scripts/run-tests.sh is the single answer to "what does running the
      # tests mean"; the Makefile, the pull request lane and the release lane
      # all call it. This job used to call ctest directly, which spawns one
      # process per test case: 3400 sanitized startups against a two-hour
      # budget. The script runs each suite once instead, and treats a suite
      # missing from the build as an error rather than -- as --no-tests=ignore
      # did -- a reason to report success.
      #
      # The pr profile, not the full one. The full profile's headless battles
      # and asset sweeps (tests/extended_tests.txt) take about three hours in a
      # plain Debug build, and under a sanitizer they ran into the two-hour limit
      # every Monday, so this lane was cancelled with nothing reported. The pr
      # profile still runs every binary and every fast test -- about three
      # minutes in Debug on the pull request lane -- and the extended set keeps
      # its owner in extended-validation.yml.
      - name: Run tests under ${{ matrix.sanitizer }}Sanitizer
        env:
          SOI_TEST_PROFILE: pr
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:strict_string_checks=1
          # D-Bus, the GL driver and the QML engine each keep process-lifetime
          # allocations that LeakSanitizer counts. tools/lsan-suppressions.txt
          # lists them and says why; anything with a project frame in it is a
          # real leak and is not suppressed.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan-suppressions.txt
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-tests.sh build --gtest_brief=1

  # ---------------------------------------------------------------------
  # Coverage report over the unit test suite.
  # ---------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          cache: true
          modules: qt5compat qtmultimedia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 gcovr ffmpeg

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEFAULT_LANG=en \
            -DENABLE_COVERAGE=ON

      # Coverage is measured over what the tests execute, so the untested
      # tools do not need building; gcovr reports on the instrumented sources
      # that ran either way.
      - name: Build the test binaries
        run: cmake --build build --parallel --target soi_test_binaries

      # The pr profile for the same reason as the sanitizer lanes: the extended
      # battles ran this job into its two-hour limit before gcovr ever ran.
      - name: Run tests
        env:
          SOI_TEST_PROFILE: pr
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-tests.sh build --gtest_brief=1

      # Steps run under `bash -e` but not `-o pipefail`, so without this a
      # gcovr that dies still exits 0 through tee and the job publishes an
      # empty summary as if it had worked.
      - name: Generate report
        run: |
          set -o pipefail
          gcovr --root . \
            --exclude 'build/' \
            --exclude 'third_party/' \
            --exclude 'tests/' \
            --html-details coverage.html \
            --xml coverage.xml \
            --print-summary | tee coverage-summary.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage*.html
            coverage.xml
            coverage-summary.txt
          retention-days: 30

  # ---------------------------------------------------------------------
  # Full build, renderer self-test and packaging dry run on every supported
  # platform. Pull requests only compile and test on Linux, so this is what
  # catches Windows/macOS breakage between releases - within a week rather
  # than at tag time.
  # ---------------------------------------------------------------------
  package-linux:
    name: Package (Linux)
    uses: ./.github/workflows/build-linux.yml
    with:
      build-type: Release
      upload-artifacts: false

  package-macos:
    name: Package (macOS)
    uses: ./.github/workflows/build-macos.yml
    with:
      build-type: Release
      upload-artifacts: false
    secrets: inherit

  package-windows:
    name: Package (Windows)
    uses: ./.github/workflows/build-windows.yml
    with:
      build-type: Release
      upload-artifacts: false
    secrets: inherit
